name: Update Earthborne cards

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update-cards.mjs', '.github/workflows/update-cards.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download Earthborne card data (earthborne.build fork of RangersDB)
        run: git clone --depth 1 https://github.com/harababurel/rangers-card-data /tmp/rangers-card-data
      - name: Build data/
        run: node scripts/update-cards.mjs /tmp/rangers-card-data
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          # meta.json always changes (timestamp); only commit when card data did
          if git diff --cached --quiet -- data ':!data/meta.json'; then
            echo "No card changes."
          else
            git commit -m "Update Earthborne cards (earthborne.build data)"
            git push
          fi
