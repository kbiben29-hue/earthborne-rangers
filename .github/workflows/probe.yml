name: Probe card sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/probe.mjs']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/dragncards
          git diff --cached --quiet || { git commit -m "Probe card sources"; git pull --rebase; git push; }
