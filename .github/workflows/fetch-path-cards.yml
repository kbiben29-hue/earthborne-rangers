name: Fetch path cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-path-cards.mjs', '.github/workflows/fetch-path-cards.yml']
  schedule:
    - cron: '41 9 * * 1' # Mondays

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-path-cards.mjs
      - run: node scripts/build-game-data.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images data/dragncards src/data/game.json
          git diff --cached --quiet || { git commit -m "Fetch path card pictures (DragnCards plugin sources)"; git pull --rebase; git push; }
